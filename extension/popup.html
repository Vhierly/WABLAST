<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 250px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f4f5;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #10b981;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 4px;
    }
    .status {
      font-size: 12px;
      color: #71717a;
      background: #fff;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #e4e4e7;
    }
    button {
      background: #10b981;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button:hover {
      background: #059669;
    }
    button:active {
      transform: scale(0.98);
    }
    .footer {
      font-size: 10px;
      color: #a1a1aa;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span>WAsender Pro</span>
    </div>
    <div class="status">
      Status: <span id="statusText">Ready</span>
    </div>
    <button id="connectBtn">
      🚀 Connect to WebApp
    </button>
    <div class="footer">
      Advanced WhatsApp Blast Tool Helper
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
